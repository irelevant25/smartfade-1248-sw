<section
  class="masters sf-panel"
  [class.masters--unreported]="!mastersReported()"
  aria-labelledby="masters-title"
>
  <h2 id="masters-title" class="sf-panel-title">Masters</h2>
  @if (!mastersReported()) {
    <p class="masters__note" role="status">Not reported by the console yet</p>
  }

  <div class="masters__columns">
    <div class="masters__column">
      <button
        type="button"
        class="masters__toggle masters__solo"
        [class.masters__solo--on]="masters().solo"
        [attr.aria-pressed]="masters().solo"
        [disabled]="!enabled() || !supports('setSolo') || !writable('solo')"
        [attr.title]="
          observedOnly()
            ? 'SOLO as read from its LED (an inferred reading)'
            : 'Bump mode: off = pile-on, on = solo'
        "
        (click)="toggleSolo()"
      >
        Solo
      </button>
      <sf-channel-fader
        label="BUMPS"
        [desired]="masters().bumps"
        [disabled]="!enabled()"
        [readOnly]="!supports('setBumps') || !writable('bumps')"
        (levelChange)="setBumps($event)"
      />
    </div>

    <div class="masters__column">
      <button
        type="button"
        class="masters__toggle masters__blackout"
        [class.masters__blackout--on]="masters().blackout"
        [class.masters__blackout--blink]="blackoutBlinks()"
        [class.masters__toggle--unknown]="blackoutUnknown()"
        [attr.aria-pressed]="blackoutUnknown() ? null : masters().blackout"
        [disabled]="!enabled() || !supports('setBlackout') || !writable('blackout')"
        [attr.title]="
          blackoutUnknown()
            ? 'Not reported by the console yet'
            : observedOnly()
              ? 'LED reading (steady blue = on)'
              : blackoutBlinks()
                ? 'The MASTER is below 100 %'
                : null
        "
        (click)="toggleBlackout()"
      >
        Blackout
      </button>
      <sf-channel-fader
        label="MASTER"
        [desired]="masters().master"
        [disabled]="!enabled()"
        [readOnly]="!supports('setMaster') || !writable('master')"
        (levelChange)="setMaster($event)"
      />
    </div>
  </div>

  <div class="masters__independents" role="group" aria-labelledby="independents-title">
    <h3 id="independents-title" class="sf-panel-title masters__subtitle">Independents</h3>
    <div class="masters__columns masters__columns--keys">
      <button
        type="button"
        class="masters__toggle masters__ind"
        [class.masters__ind--on]="masters().independent1"
        [class.masters__toggle--unknown]="independentsUnknown()"
        [attr.aria-pressed]="independentsUnknown() ? null : masters().independent1"
        [disabled]="!enabled() || !supports('setIndependent') || !writable('independent:1')"
        [attr.title]="
          independentsUnknown()
            ? 'Not reported by the console yet'
            : observedOnly()
              ? 'Reported by the console (IND 1 identified by a timed press, E8b)'
              : 'Independent 1 (DMX 97 by default)'
        "
        (click)="toggleIndependent(1)"
      >
        Ind 1
      </button>
      <button
        type="button"
        class="masters__toggle masters__ind"
        [class.masters__ind--on]="masters().independent2"
        [class.masters__toggle--unknown]="independentsUnknown()"
        [attr.aria-pressed]="independentsUnknown() ? null : masters().independent2"
        [disabled]="!enabled() || !supports('setIndependent') || !writable('independent:2')"
        [attr.title]="
          independentsUnknown()
            ? 'Not reported by the console yet'
            : observedOnly()
              ? 'Reported by the console (IND 2 identified by a timed press, E8b)'
              : 'Independent 2 (DMX 98 by default)'
        "
        (click)="toggleIndependent(2)"
      >
        Ind 2
      </button>
    </div>
  </div>
</section>
