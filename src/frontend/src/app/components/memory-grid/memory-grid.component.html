<section
  class="memories sf-panel"
  [class.memories--armed]="mode() !== 'idle'"
  aria-labelledby="memories-title"
>
  <div class="memories__head">
    <h2 id="memories-title" class="sf-panel-title">Memories</h2>

    <div class="memories__pages" role="group" aria-label="Memory page">
      <span class="memories__pages-label" aria-hidden="true">Page</span>
      @for (p of pages(); track p) {
        <button
          type="button"
          class="memories__page"
          [class.memories__page--current]="p === page()"
          [class.memories__page--content]="pageHasContent()[p - 1]"
          [class.memories__page--console]="p === consolePage()"
          [disabled]="!enabled()"
          [attr.aria-pressed]="p === page()"
          [attr.aria-label]="'Page ' + p"
          [attr.title]="p === consolePage() ? 'The page selected on the console' : null"
          (click)="selectPage(p)"
        >
          {{ p }}
        </button>
      }
    </div>

    @if (hint(); as text) {
      <p class="memories__hint" role="status">{{ text }}</p>
    }
    @if (!reported()) {
      <p class="memories__note" role="status">{{ unreportedNote() }}</p>
    } @else if (hasUnreported()) {
      <p class="memories__note" role="status">Dimmed memories were not delivered by the console in this session</p>
    }
  </div>

  <div
    class="memories__faders"
    [class.memories__faders--unreported]="!reported()"
    role="group"
    [attr.aria-label]="'Memories of page ' + page()"
    [style.--columns]="memories().length"
  >
    @for (memory of memories(); track memory.number) {
      <sf-channel-fader
        [class.memories__fader--unreported]="!memory.reported"
        [label]="memory.fader"
        kind="memory"
        [caption]="memory.label"
        [desired]="memory.reported ? memory.level : 0"
        [disabled]="!enabled()"
        [readOnly]="faderReadOnly(memory)"
        [bumpable]="true"
        [bumpDisabled]="bumpDisabledFor(memory)"
        [bumpLit]="memory.reported ? bumpLit(memory) : 0"
        [bumpArmed]="armedFor(memory)"
        (levelChange)="setLevel(memory, $event)"
        (bumpChange)="bump(memory, $event)"
        (select)="pick(memory)"
        (navigate)="moveFocus(memory.fader, $event)"
      />
    }
  </div>
</section>
