<section class="xfade sf-panel" aria-labelledby="xfade-title">
  <h2 id="xfade-title" class="sf-panel-title">Crossfader</h2>
  <p class="xfade__note">
    {{
      playbackNote() ??
        (keys() ? 'Observed from the console: the STACK and CLEAR LEDs' : 'Stack playback is not in the simulator yet.')
    }}
  </p>

  <div class="xfade__columns">
    <div class="xfade__column">
      <sf-channel-fader label="A" [desired]="faderA()" [disabled]="!crossfader()" [readOnly]="true" />
      <button
        type="button"
        class="xfade__key xfade__go"
        [disabled]="!enabled() || !canGo()"
        aria-label="Go"
        [attr.title]="canGo() ? 'Go: the next step of the stack on the console (a key tap)' : 'Go: not available on this device'"
        (click)="go()"
      >
        <svg class="xfade__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M3 2l11 6-11 6z" />
        </svg>
      </button>
      <button
        type="button"
        class="xfade__key xfade__stack"
        [class.xfade__key--lit]="stackLed()?.light === 'full'"
        [class.xfade__key--dim]="stackLed()?.light === 'dim'"
        [class.sf-key--blink]="stackLed()?.blinking === true"
        [class.xfade__key--led]="!!keys()"
        disabled
        [attr.title]="keys() ? ledTitle : 'Stack: not available yet'"
      >
        Stack
      </button>
    </div>

    <div class="xfade__column">
      <sf-channel-fader label="B" [desired]="faderB()" [disabled]="!crossfader()" [readOnly]="true" />
      <button
        type="button"
        class="xfade__key xfade__pause"
        disabled
        aria-label="Pause"
        title="Pause: not available yet"
      >
        <svg class="xfade__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M3 2h4v12H3zM9 2h4v12H9z" />
        </svg>
      </button>
      <button
        type="button"
        class="xfade__key xfade__rate"
        disabled
        title="Rate: the fade / wait balance of the whole stack, set with the wheel while STACK is active (manual); not available yet"
      >
        Rate
      </button>
    </div>
  </div>

  <button
    type="button"
    class="xfade__key xfade__clear"
    [class.xfade__clear--series]="clearPresses() > 0"
    [class.xfade__key--lit]="clearLed()?.light === 'full'"
    [class.xfade__key--dim]="clearLed()?.light === 'dim'"
    [class.sf-key--blink]="clearLed()?.blinking === true"
    [class.xfade__key--led]="!!keys()"
    [disabled]="!enabled() || !canClear()"
    [attr.title]="
      keys()
        ? ledTitle
        : 'Clear: once aborts a recording function, twice clears the channel faders, three times the memory faders'
    "
    (click)="clear()"
  >
    Clear
  </button>
</section>
