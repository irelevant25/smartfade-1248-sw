<section class="record sf-panel" aria-labelledby="record-title">
  <h2 id="record-title" class="sf-panel-title">Record</h2>

  <div class="record__keys">
    <button
      type="button"
      class="record__key record__key--white record__copy"
      [class.record__key--lit]="copyArmed() || copyLed()?.light === 'full'"
      [class.record__key--dim]="copyLed()?.light === 'dim'"
      [class.sf-key--blink]="copyLed()?.blinking === true"
      [class.record__key--led]="!!keys()"
      [attr.aria-pressed]="keys() ? null : copyArmed()"
      [disabled]="!enabled() || !canStore()"
      [attr.title]="keys() ? ledTitle : 'Copy a memory into another'"
      (click)="toggleCopy()"
    >
      Copy
    </button>
    <button
      type="button"
      class="record__key record__key--yellow"
      [class.record__key--lit]="recSeqLed()?.light === 'full'"
      [class.record__key--dim]="recSeqLed()?.light === 'dim'"
      [class.sf-key--blink]="recSeqLed()?.blinking === true"
      [class.record__key--led]="!!keys()"
      disabled
      [attr.title]="keys() ? ledTitle : 'Sequences are not in the simulator yet'"
    >
      Rec Seq
    </button>
    <button
      type="button"
      class="record__key record__key--white"
      [class.record__key--lit]="magicLed()?.light === 'full'"
      [class.record__key--dim]="magicLed()?.light === 'dim'"
      [class.sf-key--blink]="magicLed()?.blinking === true"
      [class.record__key--led]="!!keys()"
      disabled
      [attr.title]="keys() ? ledTitle : 'Magic looks are not in the simulator yet'"
    >
      Magic
    </button>
    <button
      type="button"
      class="record__key record__key--red record__rec"
      [class.record__key--lit]="recordArmed() || recMemLed()?.light === 'full'"
      [class.record__key--dim]="recMemLed()?.light === 'dim'"
      [class.sf-key--blink]="recMemLed()?.blinking === true"
      [class.record__key--led]="!!keys()"
      [attr.aria-pressed]="keys() ? null : recordArmed()"
      [disabled]="!enabled() || !canRecord()"
      [attr.title]="keys() ? ledTitle : 'Record the current look into a memory'"
      (click)="toggleRecord()"
    >
      Rec Mem
    </button>
    <button
      type="button"
      class="record__key record__key--red record__edit"
      [class.record__key--lit]="editArmed() || editMemLed()?.light === 'full'"
      [class.record__key--dim]="editMemLed()?.light === 'dim'"
      [class.sf-key--blink]="editMemLed()?.blinking === true"
      [class.record__key--led]="!!keys()"
      [attr.aria-pressed]="keys() ? null : editArmed()"
      [disabled]="!enabled() || !canStore()"
      [attr.title]="keys() ? ledTitle : 'Edit a memory on the channel faders'"
      (click)="toggleEdit()"
    >
      Edit Mem
    </button>
    <button
      type="button"
      class="record__key record__key--red record__snapshot"
      disabled
      title="Snapshots are not in the simulator yet"
    >
      Snapshot
    </button>
  </div>
</section>
