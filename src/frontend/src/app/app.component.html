<sf-connection-bar class="shell__bar" />

<main class="shell__main">
  @if (view() === 'console') {
    <sf-channel-grid class="shell__channels" />
    <sf-memory-grid class="shell__memories" />
    <sf-record-keys class="shell__record" />
    <sf-crossfader class="shell__crossfader" />
    <sf-masters-panel class="shell__masters" />
  } @else {
    <sf-show-file-page class="shell__show" />
  }
</main>

<sf-output-meters class="shell__outputs" />
